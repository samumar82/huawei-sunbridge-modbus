[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -include src/eth_macro_compat.h
  -D CORE_DEBUG_LEVEL=1
  -D SUNBRIDGE_VERSION=\"1.0.2\"
extra_scripts = post:scripts/merge_firmware.py
